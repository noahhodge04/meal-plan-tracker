<!DOCTYPE html>
<html>
    <head>
        <title>New Transaction</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    </head>
    <body>
        <form id="submit-transaction">
            <label for="type">Transaction Type</label><br>
                <input type="radio" id="swipe" name="type" value="swipe">
                    <label for="swipe">Swipe</label>
                <input type="radio" id="village_flex" name="type" value="village_flex">
                    <label for="village_flex">Flex</label>
                <input type="radio" id="campus_flex" name="type" value="campus_flex">
                    <label for="campus_flex">Campus Store Flex</label><br>
            <label for="amount">Transaction Amount</label>
                <input type="text" id="amount" name="amount"><br>
            <label for="location">Location:</label>
                <input type="text" id="location" name="location"><br>
            <label for="note">Note:</label>
                <input type="text" id="note" name="note"><br>
            <input type="submit" value="Submit">
        </form>
        <script src="{{ url_for('static',filename='js/add_transaction.js') }}"></script>
    </body>
</html>
