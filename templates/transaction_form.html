<!DOCTYPE html>
<html>
    <head>
        <title>New Transaction</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    </head>
    <body class="container">
        <form id="submit-transaction">
            <label for="type">Transaction Type</label>
            <div class="form-field">
                <input type="radio" id="swipe" name="type" value="swipe" class="radio">
                <label for="swipe">Swipe</label></div>
            <div class="form-field">
                <input type="radio" id="village_flex" name="type" value="village_flex" class="radio">
                <label for="village_flex">Flex</label></div>
            <div class="form-field">
                <input type="radio" id="campus_flex" name="type" value="campus_flex" class="radio">
                <label for="campus_flex">Campus Store Flex</label></div>
            <div class="form-field">
                <label for="amount">Transaction Amount</label>
                <input type="text" id="amount" name="amount">
            </div>
            <div class="form-field">
                <label for="location">Location:</label>
                <select id="location" name="location">
                    <option value="Alpha">Alpha</option>
                    <option value="Westy">Westy</option>
                    <option value="JazzBucks">JazzBucks</option>
                    <option value="Campus Store">Campus Store</option>
                    <option value="The Boathouse">The Boathouse</option>
                    <option value="Cerulean">Cerulean</option>
                    <option value="Social">Social</option>
                    <option value="Rocket Fizz">Rocket Fizz</option>
                    <option value="WL Coffee Shop">WL Coffee Shop</option>
                </select>
            </div>
            <div class="form-field">
                <label for="note">Note:</label>
                <input type="text" id="note" name="note"><br>
            </div>
            <input type="submit" value="Submit" class="btn btn-primary">
        </form>
        <a href="{{  url_for('home')  }}" class="btn btn-secondary">Back</a>
        <script src="{{ url_for('static',filename='js/add_transaction.js') }}"></script>
    </body>
</html>
