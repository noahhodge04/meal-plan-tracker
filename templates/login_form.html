<!DOCTYPE html>
<html>
    <head>
        <title>Login</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    </head>
    <body class="container">
        <header class="d-flex justify-content-center py-3">
            <ul class="nav nav-pills">
                <li class="nav-item"><a href="{{  url_for('login_page')  }}" class="nav-link active">Log In</a></li>
                <li class="nav-item"><a href="{{  url_for('register_page')  }}" class="nav-link">Register</a></li>
            </ul>
        </header>
        <form id="submit-credentials">
            <div class="form-field">
                <label for="login_id">Username</label>
                <input type="text" id="name" name="name">
            </div>
            <div class="form-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password">
            </div>
            <input type="submit" value="Submit" class="btn btn-primary">
        </form>
        <script src="{{  url_for('static',filename='js/submit_credentials.js')  }}" data-interface="login" data-redirect="/"></script>
    </body>
</html>
